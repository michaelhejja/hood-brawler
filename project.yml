name: Brawler
options:
  bundleIdPrefix: com.hejja
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Brawler:
    type: application
    platform: iOS
    sources: [Brawler]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hejja.brawler
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6JR5G4JR45
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "7"                       # raise this for every TestFlight upload
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO    # no custom encryption: skips the export-compliance question
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Brawler
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
